<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var k = "uniPiperTheme";
          var s = localStorage.getItem(k);
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>Alumni — UNi Piper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="app-auth.js"></script>
  </head>
  <body class="app-student">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="app-mobile">
      <header class="app-module-header">
        <h1>Alumni network</h1>
        <p class="app-sub">Connect with 6+ alumni</p>
        <div style="display: flex; gap: 0.5rem; align-items: center">
          <div class="app-search" style="flex: 1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              ><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /></svg
            >
            <input type="search" placeholder="Search by name, company, role…" aria-label="Search alumni" />
          </div>
          <button type="button" class="app-icon-btn" style="flex-shrink: 0" aria-label="Filter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              ><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" /></svg
            >
          </button>
        </div>
      </header>

      <div class="app-content">
        <article class="app-alumni-card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start">
            <div class="app-alumni-top">
              <div class="app-alumni-avatar" aria-hidden="true"></div>
              <div>
                <h3>Priya Reddy</h3>
                <p class="role">Software engineer</p>
                <p class="company-row">&#128188; Google · &#128205; Bangalore</p>
              </div>
            </div>
            <span style="font-size: 1.25rem" aria-hidden="true">in</span>
          </div>
          <div class="app-tag-row">
            <span class="app-tag-sm">CSE</span>
            <span class="app-tag-sm">2018–2022</span>
            <span class="app-tag-sm tag-mentor">Mentor</span>
            <span class="app-tag-sm tag-ref">Referrals</span>
          </div>
          <div class="app-skill-chips">
            <span>System design</span><span>DSA</span><span>Cloud</span>
          </div>
          <button type="button" class="app-btn-connect">&#128172; Connect</button>
        </article>

        <article class="app-alumni-card">
          <div class="app-alumni-top">
            <div class="app-alumni-avatar" style="background: linear-gradient(135deg, #93c5fd, #3b82f6)"></div>
            <div>
              <h3>Arjun Mehta</h3>
              <p class="role">Product designer</p>
              <p class="company-row">&#128188; Microsoft · &#128205; Hyderabad</p>
            </div>
          </div>
          <div class="app-tag-row">
            <span class="app-tag-sm">ECE</span>
            <span class="app-tag-sm">2017–2021</span>
            <span class="app-tag-sm tag-mentor">Mentor</span>
          </div>
          <div class="app-skill-chips"><span>UX</span><span>Figma</span><span>Research</span></div>
          <button type="button" class="app-btn-connect">&#128172; Connect</button>
        </article>
      </div>

      <p class="app-version">UNi Piper v1.0.0</p>

      <nav class="app-bottom-nav" aria-label="Main">
        <a href="erp.html" class="app-nav-item"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg
          >Home</a
        >
        <a href="clubs.html" class="app-nav-item"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg
          >Clubs</a
        >
        <a href="alumni.html" class="app-nav-item is-active"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></svg
          >Alumni</a
        >
        <a href="market.html" class="app-nav-item"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" /></svg
          >Market</a
        >
        <a href="profile.html" class="app-nav-item"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg
          >Profile</a
        >
      </nav>
    </div>
    <script src="theme.js" defer></script>
  </body>
</html>
