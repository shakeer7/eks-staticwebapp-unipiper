<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var k = "uniPiperTheme";
          var s = localStorage.getItem(k);
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>Marketplace — UNi Piper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="app-auth.js"></script>
  </head>
  <body class="app-student">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="app-mobile">
      <header class="app-module-header">
        <div style="display: flex; justify-content: space-between; align-items: flex-start">
          <div>
            <h1 style="margin: 0">Marketplace</h1>
            <p class="app-sub" style="margin-bottom: 0">Buy &amp; sell within campus</p>
          </div>
          <button type="button" class="app-btn-gold" aria-label="Add listing">+</button>
        </div>
        <div class="app-search" style="margin-top: 0.85rem">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /></svg
          >
          <input type="search" placeholder="Search items…" aria-label="Search marketplace" />
        </div>
      </header>

      <div class="app-content">
        <div class="app-chips">
          <button type="button" class="app-chip is-active">All</button>
          <button type="button" class="app-chip">&#128218; Books</button>
          <button type="button" class="app-chip">&#128241; Electronics</button>
          <button type="button" class="app-chip">&#128690; Cycles</button>
          <button type="button" class="app-chip">&#129518; Calculators</button>
        </div>

        <div class="app-market-grid">
          <a href="#" class="app-product-card">
            <div class="ph" style="background: linear-gradient(145deg, #e2e8f0, #94a3b8)"></div>
            <div class="body">
              <strong>Data Structures &amp; Algo…</strong>
              <div class="app-price">&#8377;350</div>
              <span class="status">Like new</span>
            </div>
          </a>
          <a href="#" class="app-product-card">
            <div class="ph" style="background: linear-gradient(145deg, #cbd5e1, #64748b)"></div>
            <div class="body">
              <strong>City bicycle 21 gear</strong>
              <div class="app-price">&#8377;4500</div>
              <span class="status good">Good</span>
            </div>
          </a>
          <a href="#" class="app-product-card">
            <div class="ph" style="background: linear-gradient(145deg, #fef3c7, #fcd34d)"></div>
            <div class="body">
              <strong>Graphing calculator</strong>
              <div class="app-price">&#8377;1200</div>
              <span class="status">Like new</span>
            </div>
          </a>
          <a href="#" class="app-product-card">
            <div class="ph" style="background: linear-gradient(145deg, #dbeafe, #60a5fa)"></div>
            <div class="body">
              <strong>USB-C hub</strong>
              <div class="app-price">&#8377;800</div>
              <span class="status good">Good</span>
            </div>
          </a>
        </div>
      </div>

      <p class="app-version">UNi Piper v1.0.0</p>

      <nav class="app-bottom-nav" aria-label="Main">
        <a href="erp.html" class="app-nav-item"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg
          >Home</a
        >
        <a href="clubs.html" class="app-nav-item"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg
          >Clubs</a
        >
        <a href="alumni.html" class="app-nav-item"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></svg
          >Alumni</a
        >
        <a href="market.html" class="app-nav-item is-active"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" /></svg
          >Market</a
        >
        <a href="profile.html" class="app-nav-item"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            ><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg
          >Profile</a
        >
      </nav>
    </div>
    <script src="theme.js" defer></script>
  </body>
</html>
