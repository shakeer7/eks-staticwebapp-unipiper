<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var k = "uniPiperTheme";
          var s = localStorage.getItem(k);
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>Register — UNi Piper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="page">
      <header>
        <a class="logo" href="index.html">UN<span>i</span> Piper</a>
        <nav class="nav-actions" aria-label="Account">
          <button type="button" class="theme-toggle" id="theme-toggle">
            <span class="theme-toggle-icon" aria-hidden="true">&#9728;</span>
          </button>
          <a class="btn btn-ghost" href="login.html">Log in</a>
          <a class="btn btn-primary" href="register.html">Register</a>
        </nav>
      </header>

      <div class="auth-wrap">
        <div class="auth-card">
          <h2>Create account</h2>
          <p class="sub">Join UNi Piper in a few steps.</p>
          <form action="#" method="post">
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
            </div>
            <button class="btn btn-primary btn-block" type="submit">Register</button>
          </form>
          <p class="auth-footer">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </div>
      </div>

      <footer>&copy; UNi Piper</footer>
    </div>
    <script src="theme.js" defer></script>
  </body>
</html>
